name: Daily legislation tracker update

on:
  schedule:
    # 每天 22:00 UTC = 北京时间次日 06:00
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run updater
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/update.py

      - name: Validate HTML & JS
        run: python scripts/validate.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无改动，跳过提交"
          else
            git commit -m "chore: daily legislation update $(TZ=Asia/Shanghai date +%F)"
            # 若期间有其它提交，rebase 后再推，避免非快进冲突
            for i in 1 2 3; do
              git push && break
              echo "push 失败，第 $i 次重试…"; git pull --rebase origin main; sleep 5
            done
          fi

      - name: Summary
        run: |
          if [ -f scripts/run_summary.txt ]; then cat scripts/run_summary.txt >> $GITHUB_STEP_SUMMARY; fi
